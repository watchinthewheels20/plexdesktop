name: Cancel superseded review CI
on:
  push:
    branches:
      - feature/plex-web-ui

permissions:
  actions: write
  contents: read

jobs:
  cancel-old:
    if: ${{ github.repository == 'watchinthewheels20/plexdesktop' }}
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only obsolete CI runs on this review branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          old_runs=$(gh api "repos/${REPOSITORY}/actions/runs?branch=feature/plex-web-ui&per_page=100" \
            --jq '.workflow_runs[] | select(.name == "CI - Sanity Checks" and .head_sha != env.COMMIT_SHA and (.status == "queued" or .status == "in_progress" or .status == "pending")) | .id')
          if [[ -z "$old_runs" ]]; then
            echo "No superseded CI runs"
            exit 0
          fi
          while IFS= read -r id; do
            [[ -z "$id" ]] && continue
            echo "Cancelling superseded review CI run ${id}"
            gh api -X POST "repos/${REPOSITORY}/actions/runs/${id}/cancel" || true
          done <<< "$old_runs"
