name: One-off project-aware Dart formatter
on:
  push:
    branches:
      - feature/plex-web-ui
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.repository == 'watchinthewheels20/plexdesktop' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Install locked project dependencies for correct language version
        run: flutter pub get --enforce-lockfile --no-example
      - name: Format sources and verify a second pass is stable
        shell: bash
        run: |
          files=(
            lib/screens/discover_screen.dart
            lib/screens/libraries/libraries_screen.dart
            lib/screens/main_screen.dart
            lib/screens/media_detail_screen.dart
            lib/screens/metadata_edit_screen.dart
            lib/screens/profile/profile_switch_screen.dart
            lib/services/settings_service.dart
            lib/services/update_service.dart
            lib/theme/mono_theme.dart
            lib/widgets/focusable_tab_chip.dart
            lib/widgets/hub_section.dart
            lib/widgets/settings_section.dart
            lib/widgets/side_navigation_rail.dart
            test/plex_web_theme_test.dart
            test/theme/mono_theme_test.dart
          )
          dart format --page-width=120 "${files[@]}"
          dart format --page-width=120 --output=none --set-exit-if-changed "${files[@]}"
      - name: Commit formatted sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          if ! git diff --cached --quiet; then
            git commit -m "style: format sources with project language version 3.12"
            git push origin HEAD:feature/plex-web-ui
          fi
